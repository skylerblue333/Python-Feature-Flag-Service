name: feature-flags-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt ruff pip-audit
      - name: Compile
        run: python -m compileall -q src tests
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: python -m pytest -q
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Build image
        run: docker build -t sky-feature-flags:ci .
      - name: Verify non-root image
        run: test "$(docker run --rm --entrypoint id sky-feature-flags:ci -u)" != "0"
